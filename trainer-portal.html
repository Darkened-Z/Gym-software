<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Bhatti Gym — Trainer Dashboard</title>
<link rel="manifest" href="manifest.php">
<link rel="icon" href="assets/images/bhatti-logo.png">
<link rel="apple-touch-icon" href="assets/images/bhatti-logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="assets/css/fit-app.css?v=2">
<style>
  .slot { border:1px solid var(--line-strong); padding:1rem; background:var(--ink-2); }
  .slot b { display:block; margin-top:.4rem; }
  .slot small { color:var(--fg-3); font-size:.8rem; }
  .block { padding:.6rem .8rem; background:var(--ink-2); border-left:3px solid var(--accent); }
  .block.b { border-left-color:var(--blue); } .block.g { border-left-color:var(--green); }
  .block b { font-size:.88rem; } .block div { color:var(--fg-3); font-size:.8rem; }
  .search { padding:.45rem .8rem; background:var(--ink); color:var(--fg); border:1px solid var(--line-strong); font-size:.82rem; outline:none; font-family:inherit; }
  .search:focus { border-color:var(--accent); }
  .tile { background:var(--ink); padding:.75rem; border:1px solid var(--line-strong); }
</style>
</head>
<body>

<div class="app" id="portalView" style="display:none;">
  <aside class="sidebar">
    <div class="brand-row">
      <img class="brand-mark brand-sidebar-logo" src="assets/images/bhatti-logo.png" onerror="this.src='assets/icons/gym-icon.svg'" alt="Bhatti Gym">
      <div class="brand-txt">
        <span class="big gym-brand-name">Bhatti Gym</span>
        <span class="small">Trainer Dashboard</span>
      </div>
    </div>
    <nav class="nav" id="sidebarNav">
      <a href="#dashboard" class="active" data-tab="dashboard"><span class="ico">📊</span> Dashboard</a>
      <a href="#members" data-tab="members"><span class="ico">👥</span> My Members</a>
      <a href="#schedule" data-tab="schedule"><span class="ico">📅</span> PT Schedule</a>
      <a href="#earnings" data-tab="earnings"><span class="ico">💰</span> Earnings</a>
      <a href="#profile" data-tab="profile"><span class="ico">👤</span> Profile</a>
    </nav>
    <div class="side-foot">
      <div class="avatar" id="sideAv">T</div>
      <div class="who">
        <b id="sideName">Trainer</b>
        <small id="sideCode"></small>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Log out">Log out</button>
    </div>
  </aside>

  <div style="min-width:0;">
    <div class="topbar">
      <div class="brand-row">
      <img class="brand-mark brand-sidebar-logo" src="assets/images/bhatti-logo.png" onerror="this.src='assets/icons/gym-icon.svg'" alt="Bhatti Gym">
      <div class="brand-txt">
        <span class="big gym-brand-name">Bhatti Gym</span>
      </div>
    </div>
      <button class="hamb" id="hambBtn" aria-label="Menu">☰</button>
    </div>
    <main class="main" id="mainContent">
      <div class="loading">Loading…</div>
    </main>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav" style="display:none;">
  <a href="#dashboard" class="active" data-tab="dashboard"><span class="ico">📊</span>Home</a>
  <a href="#members" data-tab="members"><span class="ico">👥</span>Members</a>
  <a href="#schedule" data-tab="schedule"><span class="ico">📅</span>Schedule</a>
  <a href="#earnings" data-tab="earnings"><span class="ico">💰</span>Earnings</a>
  <a href="#profile" data-tab="profile"><span class="ico">👤</span>Profile</a>
</nav>

<div class="backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer">
  <div class="brand-row">
      <img class="brand-mark brand-sidebar-logo" src="assets/images/bhatti-logo.png" onerror="this.src='assets/icons/gym-icon.svg'" alt="Bhatti Gym">
      <div class="brand-txt">
        <span class="big gym-brand-name">Bhatti Gym</span>
        <span class="small">Trainer Dashboard</span>
      </div>
    </div>
  <nav class="nav" id="drawerNav">
    <a href="#dashboard" class="active" data-tab="dashboard"><span class="ico">📊</span> Dashboard</a>
      <a href="#members" data-tab="members"><span class="ico">👥</span> My Members</a>
      <a href="#schedule" data-tab="schedule"><span class="ico">📅</span> PT Schedule</a>
      <a href="#earnings" data-tab="earnings"><span class="ico">💰</span> Earnings</a>
      <a href="#profile" data-tab="profile"><span class="ico">👤</span> Profile</a>
  </nav>
  <div class="side-foot">
    <div class="avatar" id="drawerAv">T</div>
    <div class="who">
      <b id="drawerName">Trainer</b>
      <small id="drawerCode"></small>
    </div>
    <button class="logout-btn" id="drawerLogoutBtn">Log out</button>
  </div>
</aside>

<div id="modalContainer"></div>

<script src="assets/js/branding.js?v=3"></script>
<script>
(function() {
  'use strict';

  let currentTrainer = null;
  let portalData = null;
  let currentActiveTab = 'dashboard';

  // 1. Auth: the trainer signs in on the main login page (Member | Trainer switch)
  async function checkAuth() {
    try {
      const res = await fetch('api/trainers.php?action=portal_data', { credentials: 'same-origin' });
      const data = await res.json();
      if (data && data.success) {
        portalData = data;
        currentTrainer = data.trainer;
        showPortalView();
        updateSidebar();
        renderTab(currentActiveTab);
      } else {
        showLoginView();
      }
    } catch (err) {
      showLoginView();
    }
  }

  function showLoginView() {
    location.replace('index.html#trainer');
  }

  function showPortalView() {
    document.getElementById('portalView').style.display = 'grid';
    document.getElementById('bottomNav').style.display = '';
  }

  async function logout() {
    try {
      await fetch('api/trainers.php?action=portal_logout', { method: 'POST', credentials: 'same-origin' });
    } catch (err) { /* session will expire on its own */ }
    location.replace('index.html');
  }

  document.getElementById('logoutBtn').addEventListener('click', logout);
  const dLogout = document.getElementById('drawerLogoutBtn');
  if (dLogout) dLogout.addEventListener('click', logout);

  function updateSidebar() {
    if (!currentTrainer) return;
    const name = currentTrainer.name;
    const code = currentTrainer.trainer_code;
    const init = name.charAt(0).toUpperCase();

    document.getElementById('sideName').textContent = name;
    document.getElementById('sideCode').textContent = code;
    document.getElementById('sideAv').textContent = init;

    const dName = document.getElementById('drawerName');
    const dCode = document.getElementById('drawerCode');
    const dAv = document.getElementById('drawerAv');
    if (dName) dName.textContent = name;
    if (dCode) dCode.textContent = code;
    if (dAv) dAv.textContent = init;
  }

  // 2. Tab Routing
  function renderTab(tab) {
    currentActiveTab = tab;
    document.querySelectorAll('#sidebarNav a, #drawerNav a, #bottomNav a').forEach(a => {
      a.classList.toggle('active', a.dataset.tab === tab);
    });

    if (!portalData) return;
    const main = document.getElementById('mainContent');

    switch (tab) {
      case 'dashboard': renderDashboard(main); break;
      case 'members':   renderMembersList(main); break;
      case 'schedule':  renderSchedule(main); break;
      case 'earnings':  renderEarnings(main); break;
      case 'profile':   renderProfile(main); break;
      default:          renderDashboard(main); break;
    }
  }

  // --- TAB: DASHBOARD ---
  function renderDashboard(container) {
    const s = portalData.summary || {};
    const att = portalData.attention_list || [];

    container.innerHTML = `
      <div class="page-head">
        <div>
          <h1>Welcome, Coach ${currentTrainer.name.split(' ')[0]}</h1>
          <p class="sub">Portal Dashboard · Assigned Section: ${currentTrainer.section.toUpperCase()}</p>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats">
        <div class="stat">
          <span class="k">Assigned Members</span>
          <span class="v gold">${s.total_members || 0}</span>
          <span class="delta">${s.active_members || 0} active in gym</span>
        </div>
        <div class="stat">
          <span class="k">Sessions Conducted</span>
          <span class="v green">${s.sessions_this_week || 0}</span>
          <span class="delta">This week</span>
        </div>
        <div class="stat">
          <span class="k">Est. MTD Earnings</span>
          <span class="v blue">Rs ${Number(s.mtd_earnings || 0).toLocaleString('en-PK')}</span>
          <span class="delta">Base: Rs ${Number(s.salary || 0).toLocaleString('en-PK')} + ${s.commission_pct}% PTF</span>
        </div>
        <div class="stat">
          <span class="k">Needs Attention</span>
          <span class="v ${s.attention_count > 0 ? 'red' : 'green'}">${s.attention_count || 0}</span>
          <span class="delta">${s.attention_count > 0 ? 'Absent or fee overdue' : 'All members on track'}</span>
        </div>
      </div>

      <!-- Needs Attention List -->
      <div class="card">
        <div class="card-head">
          <h2>Members Needing Attention</h2>
          <span class="sub">${att.length} MEMBERS</span>
        </div>
        <div class="card-body scroll-x">
          ${att.length === 0 ? `
            <div style="padding:2rem; text-align:center; color:var(--fg-3);">
              🎉 All assigned members are actively training with up-to-date fees!
            </div>
          ` : `
            <table class="tbl">
              <thead>
                <tr>
                  <th>MEMBER</th>
                  <th>PHONE</th>
                  <th>LAST SEEN</th>
                  <th>REASON</th>
                  <th>ACTION</th>
                </tr>
              </thead>
              <tbody>
                ${att.map(m => `
                  <tr>
                    <td>
                      <strong>${m.full_name}</strong>
                      <div class="mono">${m.member_code} · ${m.section}</div>
                    </td>
                    <td><a href="tel:${m.phone}" style="color:var(--accent);">${m.phone}</a></td>
                    <td>${m.last_checkin ? m.last_checkin.slice(0, 10) : '<span style="color:var(--red);">Never</span>'}</td>
                    <td>
                      ${(m.attention_reasons || []).map(r => `<span class="pill red">${r}</span> `).join('')}
                    </td>
                    <td>
                      <button class="btn-pill" onclick="window.openMemberModal(${m.id}, '${m.section}')">View Profile</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        </div>
      </div>

      <!-- Today's Schedule Snapshot -->
      <div class="card">
        <div class="card-head">
          <h2>Today's Training Slots</h2>
          <span class="sub">${(new Date()).toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase()}</span>
        </div>
        <div class="card-body">
          <p style="color:var(--fg-2); margin-bottom:1rem;">Members scheduled for personal training, assessment, and check-ins today.</p>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:.75rem;">
            <div class="slot">
              <span class="mono">Morning Slot · 07:00 AM – 11:00 AM</span>
              <div style="margin-top:.4rem; font-weight:600;">Open Floor & Strength Checks</div>
              <div style="color:var(--fg-3); font-size:.8rem; margin-top:.2rem;">Form coaching & progressive overload checks</div>
            </div>
            <div class="slot">
              <span class="mono">Evening Slot · 05:00 PM – 10:00 PM</span>
              <div style="margin-top:.4rem; font-weight:600;">Personal Training Appointments</div>
              <div style="color:var(--fg-3); font-size:.8rem; margin-top:.2rem;">1-on-1 PT sessions & body measurements</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // --- TAB: MY MEMBERS ---
  function renderMembersList(container) {
    const members = portalData.members || [];

    container.innerHTML = `
      <div class="page-head">
        <div>
          <h1>My Assigned Members</h1>
          <p class="sub">${members.length} Total Athletes on Roster</p>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Member Roster</h2>
          <div style="display:flex; gap:.5rem;">
            <input type="text" id="memberSearch" class="search" placeholder="Search name or code…">
          </div>
        </div>
        <div class="card-body scroll-x">
          <table class="tbl" id="rosterTable">
            <thead>
              <tr>
                <th>CODE</th>
                <th>MEMBER NAME</th>
                <th>PHONE</th>
                <th>SECTION</th>
                <th>GOAL</th>
                <th>WEIGHT</th>
                <th>FEE DUES</th>
                <th>LAST ATTENDED</th>
                <th>ACTION</th>
              </tr>
            </thead>
            <tbody>
              ${members.map(m => `
                <tr data-name="${m.full_name.toLowerCase()}" data-code="${m.member_code.toLowerCase()}">
                  <td class="mono">${m.member_code}</td>
                  <td>
                    <strong>${m.full_name}</strong>
                    <div style="color:var(--fg-4); font-size:.75rem;">${m.package_name || 'Standard'}</div>
                  </td>
                  <td><a href="tel:${m.phone}" style="color:var(--accent);">${m.phone}</a></td>
                  <td style="text-transform:capitalize;">${m.section}</td>
                  <td><span class="pill gold">${m.goal ? m.goal.toUpperCase() : 'FITNESS'}</span></td>
                  <td>${m.last_weight ? m.last_weight + ' kg' : '—'}</td>
                  <td>
                    ${m.due_amount > 0 ? `<span class="pill red">Rs ${Number(m.due_amount).toLocaleString('en-PK')}</span>` : `<span class="pill green">Paid</span>`}
                  </td>
                  <td>${m.last_checkin ? m.last_checkin.slice(0, 10) : '—'}</td>
                  <td>
                    <button class="btn-pill" onclick="window.openMemberModal(${m.id}, '${m.section}')">Open Profile</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;

    document.getElementById('memberSearch').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll('#rosterTable tbody tr').forEach(tr => {
        const name = tr.dataset.name || '';
        const code = tr.dataset.code || '';
        tr.style.display = (name.includes(q) || code.includes(q)) ? '' : 'none';
      });
    });
  }

  // --- TAB: SCHEDULE ---
  function renderSchedule(container) {
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    container.innerHTML = `
      <div class="page-head">
        <div>
          <h1>Weekly PT & Assessment Schedule</h1>
          <p class="sub">Recurring training roster & floor coaching hours</p>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:1rem;">
        ${days.map(d => `
          <div class="card" style="margin-bottom:0;">
            <div class="card-head">
              <h2>${d}</h2>
              <span class="sub">SESSION BLOCK</span>
            </div>
            <div class="card-body">
              <div style="display:flex; flex-direction:column; gap:.6rem;">
                <div style="padding:.6rem .8rem; background:var(--ink-2); border-left:3px solid var(--accent); ">
                  <div style="font-weight:600; font-size:.88rem;">07:00 – 09:00 AM</div>
                  <div style="color:var(--fg-3); font-size:.8rem;">Early Morning Strength & Compound Lifting</div>
                </div>
                <div style="padding:.6rem .8rem; background:var(--ink-2); border-left:3px solid var(--blue); ">
                  <div style="font-weight:600; font-size:.88rem;">05:30 – 07:30 PM</div>
                  <div style="color:var(--fg-3); font-size:.8rem;">Hypertrophy Coaching & Technique Evaluation</div>
                </div>
                <div style="padding:.6rem .8rem; background:var(--ink-2); border-left:3px solid var(--green); ">
                  <div style="font-weight:600; font-size:.88rem;">08:00 – 09:30 PM</div>
                  <div style="color:var(--fg-3); font-size:.8rem;">1-on-1 PT Sessions & Progress Weigh-ins</div>
                </div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // --- TAB: EARNINGS ---
  function renderEarnings(container) {
    const s = portalData.summary || {};
    const members = portalData.members || [];

    container.innerHTML = `
      <div class="page-head">
        <div>
          <h1>Earnings & Commission Report</h1>
          <p class="sub">Month-to-Date Compensation Breakdown</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="k">Base Monthly Salary</span>
          <span class="v">Rs ${Number(s.salary || 0).toLocaleString('en-PK')}</span>
          <span class="delta">Fixed contract pay</span>
        </div>
        <div class="stat">
          <span class="k">Commission Rate</span>
          <span class="v gold">${s.commission_pct || 0}%</span>
          <span class="delta">On PT fee collections</span>
        </div>
        <div class="stat">
          <span class="k">Earned Commission</span>
          <span class="v green">Rs ${Number(s.earned_commission || 0).toLocaleString('en-PK')}</span>
          <span class="delta">MTD attribution</span>
        </div>
        <div class="stat">
          <span class="k">Total Est. Payout</span>
          <span class="v blue">Rs ${Number(s.mtd_earnings || 0).toLocaleString('en-PK')}</span>
          <span class="delta">Salary + Commission</span>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Member-by-Member Attribution</h2>
          <span class="sub">${members.length} ATHLETES</span>
        </div>
        <div class="card-body scroll-x">
          <table class="tbl">
            <thead>
              <tr>
                <th>CODE</th>
                <th>MEMBER</th>
                <th>PACKAGE</th>
                <th>MONTHLY FEE</th>
                <th>FEE STATUS</th>
                <th>EST. PT COMMISSION</th>
              </tr>
            </thead>
            <tbody>
              ${members.map(m => {
                const estPtf = Number(m.ptf_fee) > 0 ? Number(m.ptf_fee) : 2500;
                const trainerShare = Math.round((estPtf * (s.commission_pct || 0)) / 100);
                return `
                  <tr>
                    <td class="mono">${m.member_code}</td>
                    <td><strong>${m.full_name}</strong></td>
                    <td>${m.package_name || 'Standard'}</td>
                    <td>Rs ${Number(m.monthly_fee || 0).toLocaleString('en-PK')}</td>
                    <td>
                      ${m.due_amount > 0 ? `<span class="pill red">Due Rs ${Number(m.due_amount).toLocaleString('en-PK')}</span>` : `<span class="pill green">Paid</span>`}
                    </td>
                    <td style="color:var(--accent); font-weight:600;">
                      Rs ${trainerShare.toLocaleString('en-PK')}
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // --- TAB: PROFILE ---
  function renderProfile(container) {
    container.innerHTML = `
      <div class="page-head">
        <div>
          <h1>Coach Profile & Credentials</h1>
          <p class="sub">${currentTrainer.trainer_code}</p>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Personal Information</h2>
          <span class="sub">CREDENTIALS</span>
        </div>
        <div class="card-body">
          <p><strong>Full Name:</strong> ${currentTrainer.name}</p>
          <p><strong>Trainer Code:</strong> ${currentTrainer.trainer_code}</p>
          <p><strong>Mobile Phone:</strong> ${currentTrainer.phone}</p>
          <p><strong>Training Section:</strong> ${currentTrainer.section.toUpperCase()}</p>
          <p><strong>Specializations & Notes:</strong> ${currentTrainer.notes || 'Strength & Conditioning, Hypertrophy, Form Coaching'}</p>
        </div>
      </div>
    `;
  }

  // 3. Member Detail & Goal Edit Modal
  window.openMemberModal = function(memberId, section) {
    const m = (portalData.members || []).find(x => x.id == memberId && x.section == section);
    if (!m) return;

    const modal = document.getElementById('modalContainer');
    modal.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) this.remove();">
        <div class="modal">
          <div class="modal-head">
            <div>
              <h3>${m.full_name}</h3>
              <div class="mono">${m.member_code} · ${m.section.toUpperCase()}</div>
            </div>
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove();">&times;</button>
          </div>
          <div class="modal-body">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin-bottom:1.25rem;">
              <div class="tile">
                <div class="mono">Phone</div>
                <div><a href="tel:${m.phone}" style="color:var(--accent); font-weight:600;">${m.phone}</a></div>
              </div>
              <div class="tile">
                <div class="mono">Last Attended</div>
                <div>${m.last_checkin ? m.last_checkin.slice(0, 10) : 'No attendance'}</div>
              </div>
            </div>

            <form id="trainerMemberEditForm">
              <div class="field">
                <label>Primary Goal</label>
                <select id="editGoal">
                  <option value="lose" ${m.goal === 'lose' ? 'selected' : ''}>Weight / Fat Loss</option>
                  <option value="gain" ${m.goal === 'gain' ? 'selected' : ''}>Muscle Gain / Hypertrophy</option>
                  <option value="maintain" ${m.goal === 'maintain' ? 'selected' : ''}>Maintain / General Fitness</option>
                </select>
              </div>
              <div class="field">
                <label>Target Weight (kg)</label>
                <input type="number" step="0.5" id="editTargetWeight" value="${m.target_weight || ''}" placeholder="e.g. 78">
              </div>
              <div class="field">
                <label>Height (cm)</label>
                <input type="number" step="1" id="editHeight" value="${m.height || 172}" placeholder="e.g. 175">
              </div>
              <div class="field">
                <label>Trainer Coaching Notes & Prescriptions</label>
                <textarea id="editGoalNotes" rows="3" placeholder="e.g. Focus on progressive overload on squats, keep protein at 160g...">${m.goal_notes || ''}</textarea>
              </div>
              <button type="submit" class="btn-gold">Save Fitness Updates</button>
            </form>
          </div>
        </div>
      </div>
    `;

    document.getElementById('trainerMemberEditForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        member_id: m.id,
        gender: m.section,
        goal: document.getElementById('editGoal').value,
        target_weight: parseFloat(document.getElementById('editTargetWeight').value) || null,
        height: parseFloat(document.getElementById('editHeight').value) || null,
        goal_notes: document.getElementById('editGoalNotes').value.trim()
      };

      try {
        const res = await fetch('api/trainers.php?action=portal_update_member', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data && data.success) {
          document.querySelector('.modal-overlay').remove();
          checkAuth();
        } else {
          alert(data.message || 'Error updating member');
        }
      } catch (err) {
        alert('Network error updating member');
      }
    });
  };

  // 4. Drawer & Navigation Events
  const hambBtn = document.getElementById('hambBtn');
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('drawerBackdrop');

  function toggleDrawer(open) {
    if (drawer) drawer.classList.toggle('open', open);
    if (backdrop) backdrop.classList.toggle('open', open);
  }

  if (hambBtn) hambBtn.addEventListener('click', () => toggleDrawer(true));
  if (backdrop) backdrop.addEventListener('click', () => toggleDrawer(false));

  window.addEventListener('hashchange', () => {
    const tab = location.hash.replace('#', '') || 'dashboard';
    toggleDrawer(false);
    renderTab(tab);
  });

  document.querySelectorAll('#sidebarNav a, #drawerNav a, #bottomNav a').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      location.hash = a.getAttribute('href');
    });
  });

  // Boot
  checkAuth();

})();
</script>
</body>
</html>
